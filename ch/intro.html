<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>写法与底本</title>
<style>
:root{--ink:#1c1a17;--dim:#6b655d;--line:#ddd6cc;--bg:#faf7f2;--gold:#a8874f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Songti SC","Source Han Serif SC",Georgia,"PingFang SC",serif;
 font-size:18px;line-height:1.95;letter-spacing:.01em}
main{max-width:39em;margin:0 auto;padding:48px 24px 120px}
h1{font-size:1.6em;line-height:1.42;margin:0 0 1em;font-weight:700}
h2.sec{font-size:1.14em;margin:2.4em 0 .7em;padding-left:.6em;border-left:4px solid #b9a88a}
p{margin:0 0 1.05em;text-align:justify}
strong{font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:2.6em 0}
table{border-collapse:collapse;width:100%;margin:1.1em 0 1.5em;font-size:.94em}
td{border-bottom:1px solid var(--line);padding:.5em .7em;vertical-align:top;line-height:1.7}
td:first-child{color:var(--dim);white-space:nowrap;width:7.2em}
sup.fn{font-size:.66em;line-height:0;color:var(--gold);cursor:pointer;
 padding:0 .12em;font-family:system-ui,-apple-system,sans-serif}
nav{display:flex;justify-content:space-between;gap:12px;margin:3.2em 0 0;
 padding-top:1.4em;border-top:1px solid var(--line);font-size:.9em}
nav a{color:var(--gold);text-decoration:none;padding:.5em .2em}
nav a.dim{color:var(--line)}
nav a.dir{color:var(--dim)}
#nb{position:fixed;left:0;right:0;bottom:0;background:#fffdf9;border-top:1px solid var(--line);
 box-shadow:0 -6px 24px rgba(0,0,0,.10);padding:16px 20px 20px;font-size:.92em;line-height:1.75;
 color:#33302a;transform:translateY(110%);transition:transform .18s ease;z-index:9;
 max-height:55vh;overflow:auto}
#nb.on{transform:translateY(0)}
#nb .no{color:var(--gold);font-weight:700;margin-right:.4em}
#nb .x{float:right;color:var(--dim);cursor:pointer;font-size:1.1em;margin-left:1em}
ol.toc{list-style:none;padding:0;margin:1.4em 0 0}
ol.toc li{margin:0;border-bottom:1px solid var(--line)}
ol.toc a{display:block;padding:.85em .2em;text-decoration:none;color:var(--ink)}
ol.toc a .k{color:var(--gold);font-size:.82em;margin-right:.7em;
 font-family:system-ui,-apple-system,sans-serif}
ol.toc a .s{display:block;color:var(--dim);font-size:.82em;line-height:1.6;margin-top:.25em}
ol.toc li.cur a .k{color:var(--ink)}
.cover{text-align:left;margin-bottom:2.4em}
.cover h1{font-size:2em;margin-bottom:.3em}
.cover p{color:var(--dim);font-size:.92em}
@media(max-width:640px){body{font-size:17px}main{padding:30px 18px 90px}}
</style></head><body><main>
<h1>引子</h1>
<p>这本书讲的是从秦末到汉朝建立这一段。底本是《史记》和《汉书》，加了小说的笔法，也加了心理分析——史书没写的地方，我会按他的处境往下推。书里的事件、人物，甚至大部分对话，都有史料依据；出处不逐一列在正文里，需要核的看脚注。</p>
<p>引文按简体照录——底本原文用的是繁体字，凡引号里的话一律转成简体，字句一个不改。</p>
<p>先说一句：历史本身很好看，难看的是那些故作高深的写法。这句话不是我说的，是本系列参考的那位前辈说的。<sup class="fn" data-n="1">①</sup></p>
<hr/>
<nav><span class="dim">已是开头</span><a class="dir" href="../index.html">目录</a><a href="people.html">下一章：先认清这些人 →</a></nav>
</main><script>window.NOTES=["这句话来自当年明月《明朝那些事儿》的引子。本系列的写法参考了他。"];</script><script>
(function(){
 var box=document.createElement('div'); box.id='nb';
 box.innerHTML='<span class="x" id="nbx">关闭 ✕</span><span id="nbt"></span>';
 document.body.appendChild(box);
 var N = window.NOTES || [];
 function show(i){ document.getElementById('nbt').innerHTML='<span class="no">'+i+'</span>'+N[i-1]; box.classList.add('on'); }
 document.addEventListener('click', function(e){
   var sup=e.target.closest('sup.fn');
   if(sup){ show(parseInt(sup.dataset.n,10)); e.stopPropagation(); return; }
   if(!e.target.closest('#nb')) box.classList.remove('on');
 });
 document.getElementById('nbx').addEventListener('click', function(){ box.classList.remove('on'); });
 document.addEventListener('keydown', function(e){ if(e.key==='Escape') box.classList.remove('on'); });
})();
</script></body></html>
